spring.application.name=CTA
# Puerto del servidor
server.port=8080

# Configuración de la base de datos
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/cta_bd?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/CTA_BD?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Codificación
spring.datasource.sql-script-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000


# Zona horaria de la aplicación
spring.jackson.time-zone=UTC